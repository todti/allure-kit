<text x="22" y="196" xml:space="preserve"><tspan fill="#e6edf3">    dashboard   </tspan><tspan fill="#e6edf3" fill-opacity="0.62">            </tspan><tspan fill="#e6edf3">  Summary dashboard</tspan></text>
