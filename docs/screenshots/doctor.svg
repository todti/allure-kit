<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="22" y="70" fill="#8b949e">$</text><text x="38.9" y="70" fill="#e6edf3" font-weight="600">allure-kit doctor</text>
<text x="22" y="91" xml:space="preserve"></text>
<text x="22" y="112" xml:space="preserve"><tspan fill="#e6edf3">  Allure Doctor</tspan></text>
