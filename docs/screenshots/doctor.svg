<text x="22" y="385" xml:space="preserve"><tspan fill="#3fb950">  ✓ Playwright reporter is wired into its config</tspan></text>
<text x="22" y="406" xml:space="preserve"></text>
<text x="22" y="427" xml:space="preserve"><tspan fill="#e6edf3">  Checking Allure CLI...</tspan></text>
<text x="22" y="448" xml:space="preserve"><tspan fill="#3fb950">  ✓ allure CLI package is installed</tspan></text>
