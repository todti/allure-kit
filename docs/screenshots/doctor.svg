<text x="22" y="259" xml:space="preserve"><tspan fill="#3fb950">  ✓ Config found: /home/dev/my-app/allurerc.json (json)</tspan></text>
<text x="22" y="280" xml:space="preserve"><tspan fill="#3fb950">  ✓ 1 plugin(s) configured</tspan></text>
<text x="22" y="301" xml:space="preserve"><tspan fill="#56d4dd">  ℹ Output directory: ./allure-report</tspan></text>
<text x="22" y="322" xml:space="preserve"></text>
<text x="22" y="343" xml:space="preserve"><tspan fill="#e6edf3">  Checking test framework adapters...</tspan></text>
