<text x="22" y="595" xml:space="preserve"><tspan fill="#e6edf3">  Checking compatibility...</tspan></text>
<text x="22" y="616" xml:space="preserve"><tspan fill="#ff7b72">  ✗ allure-playwright@3.4.5 is too old for @playwright/test@1.60.1: Playwright 1.60 removed the</tspan></text>
<text x="22" y="637" xml:space="preserve"><tspan fill="#ff7b72">    API used for test plans, so selective runs ignore the plan (allure-js#1515)</tspan></text>
<text x="22" y="658" xml:space="preserve"><tspan fill="#e6edf3" fill-opacity="0.62">    Upgrade: allure-playwright@&gt;=3.9.0 (allure-kit update)</tspan></text>
<text x="22" y="679" xml:space="preserve"><tspan fill="#ff7b72">  ✗ allurerc has fields Allure 3.20 rejects: knownIssuesPath — every allure command fails with</tspan></text>
<text x="22" y="700" xml:space="preserve"><tspan fill="#ff7b72">    "unsupported fields"</tspan></text>
<text x="22" y="721" xml:space="preserve"><tspan fill="#e6edf3" fill-opacity="0.62">    Remove them (known issues belong under `resolutions`, or use `allure generate --known-issues</tspan></text>
<text x="22" y="742" xml:space="preserve"><tspan fill="#e6edf3" fill-opacity="0.62">      &lt;file&gt;`); a newer Allure may accept more fields</tspan></text>
<text x="22" y="763" xml:space="preserve"></text>
<text x="22" y="784" xml:space="preserve"><tspan fill="#d29922">  ⚠ Found 2 issue(s). See above for details.</tspan></text>
