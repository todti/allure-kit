<svg xmlns="http://www.w3.org/2000/svg" width="856" height="932" viewBox="0 0 856 932" role="img" aria-label="Terminal: allure-kit init --help">
<rect width="856" height="932" rx="10" fill="#0d1117"/>
<rect width="856" height="38" rx="10" fill="#161b22"/><rect y="28" width="856" height="10" fill="#161b22"/>
<circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="22" y="70" fill="#8b949e">$</text><text x="38.9" y="70" fill="#e6edf3" font-weight="600">allure-kit init --help</text>
<text x="22" y="91" xml:space="preserve"><tspan fill="#e6edf3">Initialize Allure 3 in your project</tspan></text>
<text x="22" y="112" xml:space="preserve"></text>
<text x="22" y="133" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">━━━ Usage ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan></text>
<text x="22" y="154" xml:space="preserve"></text>
<text x="22" y="175" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">$ </tspan><tspan fill="#e6edf3">allure-kit init</tspan></text>
<text x="22" y="196" xml:space="preserve"></text>
<text x="22" y="217" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">━━━ Options ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan></text>
<text x="22" y="238" xml:space="preserve"></text>
<text x="22" y="259" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--format,-f #0</tspan><tspan fill="#e6edf3">    Config file format: json, yaml, or mjs (default: json)</tspan></text>
<text x="22" y="280" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--yes,-y      </tspan><tspan fill="#e6edf3">    Accept all defaults without prompts</tspan></text>
<text x="22" y="301" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--lang #0     </tspan><tspan fill="#e6edf3">    Project language: js, ts, python or java (js/ts are treated the same; java</tspan></text>
<text x="22" y="322" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">  </tspan><tspan fill="#e6edf3">covers Gradle and Maven)</tspan></text>
<text x="22" y="343" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--framework #0</tspan><tspan fill="#e6edf3">    Force-select a single framework (e.g. playwright, vitest, wdio, pytest,</tspan></text>
<text x="22" y="364" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">  </tspan><tspan fill="#e6edf3">behave)</tspan></text>
<text x="22" y="385" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--workspaces  </tspan><tspan fill="#e6edf3">    In a monorepo, run init in every workspace package that has a test framework</tspan></text>
<text x="22" y="406" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--dry-run     </tspan><tspan fill="#e6edf3">    Show what would be installed and changed without touching any files</tspan></text>
<text x="22" y="427" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">--cwd #0      </tspan><tspan fill="#e6edf3">    Working directory (default: current directory)</tspan></text>
<text x="22" y="448" xml:space="preserve"></text>
<text x="22" y="469" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">━━━ Details ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan></text>
<text x="22" y="490" xml:space="preserve"></text>
<text x="22" y="511" xml:space="preserve"><tspan fill="#e6edf3">Detects test frameworks (by dependencies, config files, and existing tests), </tspan></text>
<text x="22" y="532" xml:space="preserve"><tspan fill="#e6edf3">installs adapters, and creates an allurerc config. Exits early if Allure is </tspan></text>
<text x="22" y="553" xml:space="preserve"><tspan fill="#e6edf3">already configured.</tspan></text>
<text x="22" y="574" xml:space="preserve"></text>
<text x="22" y="595" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">━━━ Examples ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan><tspan fill="#e6edf3" font-weight="700">━</tspan></text>
<text x="22" y="616" xml:space="preserve"></text>
<text x="22" y="637" xml:space="preserve"><tspan fill="#e6edf3">init</tspan></text>
<text x="22" y="658" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">$ </tspan><tspan fill="#e6edf3">Interactive setup with auto-detection</tspan></text>
<text x="22" y="679" xml:space="preserve"></text>
<text x="22" y="700" xml:space="preserve"><tspan fill="#e6edf3">init --lang=js --framework=playwright</tspan></text>
<text x="22" y="721" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">$ </tspan><tspan fill="#e6edf3">Non-interactive setup for a single framework</tspan></text>
<text x="22" y="742" xml:space="preserve"></text>
<text x="22" y="763" xml:space="preserve"><tspan fill="#e6edf3">init --lang=python --framework=pytest</tspan></text>
<text x="22" y="784" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">$ </tspan><tspan fill="#e6edf3">Non-interactive setup for a Python project</tspan></text>
<text x="22" y="805" xml:space="preserve"></text>
<text x="22" y="826" xml:space="preserve"><tspan fill="#e6edf3">init --format json</tspan></text>
<text x="22" y="847" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">$ </tspan><tspan fill="#e6edf3">Use JSON config format</tspan></text>
<text x="22" y="868" xml:space="preserve"></text>
<text x="22" y="889" xml:space="preserve"><tspan fill="#e6edf3">init --yes</tspan></text>
<text x="22" y="910" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">$ </tspan><tspan fill="#e6edf3">Accept all defaults without prompts</tspan></text>
</g>
</svg>
